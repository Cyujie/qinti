<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>青提私聊</title>
  <link rel="stylesheet" href="./chat.css">
</head>
<body>
  <main>
    <header>
      <a class="back icon" href="./" aria-label="返回青提首页" title="返回青提首页">‹</a>
      <span class="avatar" aria-hidden="true"><i></i></span>
      <div class="identity"><h1>青提私聊</h1><small id="roomState">加密对话</small></div>
      <details id="options" hidden>
        <summary class="icon" aria-label="聊天选项" title="聊天选项">•••</summary>
        <div class="menu">
          <button id="notify" hidden>开启桌面通知</button>
          <button id="closeRoom" hidden>结束私聊</button>
        </div>
      </details>
    </header>
    <div class="thread">
      <ul id="messages" aria-label="聊天记录" aria-live="polite"></ul>
      <div class="welcome" id="welcome">
        <span class="seal" aria-hidden="true"><i></i></span>
        <p id="intro">正在打开对话…</p>
        <button class="primary" id="create" hidden>创建私聊</button>
        <button class="primary" id="join" hidden>接受邀请</button>
      </div>
      <button id="latest" hidden>↓ 回到最新消息</button>
    </div>
    <footer>
      <div class="feedback">
        <p id="status" role="status"></p>
        <button id="invite" hidden>复制邀请链接</button>
      </div>
      <input id="copyField" aria-label="邀请链接" readonly hidden>
      <form hidden id="composer">
        <div id="queued"></div>
        <div class="compose-row">
          <input id="files" type="file" multiple hidden>
          <button type="button" class="icon" id="attach" aria-label="添加附件" title="添加附件，每个最多 16 MB"><i class="clip"></i></button>
          <textarea id="draft" rows="1" aria-label="消息" maxlength="1500" placeholder="输入消息…" title="Enter 发送，Shift + Enter 换行"></textarea>
          <button type="submit" class="icon primary" id="send" aria-label="发送" title="发送"><i class="plane"></i></button>
        </div>
      </form>
    </footer>
  </main>
  <script type="module" src="./chat.js"></script>
</body>
</html>
