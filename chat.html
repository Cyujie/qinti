<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>青提私聊</title>
<style>
:root{color-scheme:light dark;font:16px/1.55 system-ui,sans-serif}body{margin:0;background:Canvas;color:CanvasText}main{max-width:42rem;margin:auto;padding:1rem}header,.actions,form{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:1.55rem}button,a{font:inherit}button{padding:.5rem .9rem;border-radius:.7rem;border:1px solid #819789;background:Canvas;color:CanvasText;cursor:pointer}button.primary{background:#206747;color:white}button:disabled{opacity:.55}#messages{padding:0;list-style:none;max-height:50dvh;overflow:auto}li{padding:.65rem .9rem;margin:.5rem 0;background:#78878020;border-radius:.8rem;width:fit-content;max-width:84%;overflow-wrap:anywhere;white-space:pre-wrap}li.mine{margin-left:auto;background:#3a975c30}textarea{font:inherit;flex:1;min-width:9rem;padding:.65rem;border-radius:.6rem}input{box-sizing:border-box;width:100%;font:inherit}small{display:block}#status{min-height:1.6em}[hidden]{display:none!important}
.embedded body{background:transparent}.embedded main{max-width:none;padding:.25rem}.embedded header a{display:none}.embedded h1{margin:0}.embedded #messages{max-height:44dvh}
</style><main><header><h1>青提私聊</h1><a href="./">青提首页</a></header><p id="status" role="status">正在打开…</p>
<div class="actions"><button id="create" hidden>创建私聊</button><button class="primary" id="join" hidden>接受邀请</button><button id="invite" hidden>复制邀请链接</button><button id="closeRoom" hidden>结束私聊</button></div>
<input id="copyField" aria-label="邀请链接" readonly hidden><ul id="messages" aria-live="polite"></ul>
<form hidden id="composer"><textarea id="draft" aria-label="消息" maxlength="1500" placeholder="输入消息" required></textarea><button class="primary" id="send">发送</button></form>
</main><script type="module" src="./chat.js"></script></html>
