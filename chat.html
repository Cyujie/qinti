<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>青提私聊</title>
  <link rel="stylesheet" href="./chat.css">
</head>
<body>
  <main>
    <header>
      <a class="back icon" href="./" aria-label="返回青提首页" title="返回青提首页">‹</a>
      <span class="avatar" aria-hidden="true"><i></i></span>
      <div class="identity"><h1 id="chatTitle">青提私聊</h1><small id="roomState">加密对话</small></div>
      <button type="button" id="chooseRoom" hidden>会话列表</button>
      <details id="options" hidden>
        <summary class="icon" aria-label="聊天选项" title="聊天选项">•••</summary>
        <div class="menu">
          <button id="rename" hidden>修改私聊备注</button>
          <button id="notify" hidden>开启桌面通知</button>
          <button id="closeRoom" hidden>结束私聊</button>
        </div>
      </details>
    </header>
    <dialog id="renameDialog" aria-labelledby="renameTitle">
      <form id="renameForm">
        <h2 id="renameTitle">修改私聊备注</h2>
        <label id="renameHint" for="renameInput">仅同一账号的已解锁设备可见</label>
        <input id="renameInput" maxlength="40" autocomplete="off">
        <p id="renameStatus" role="status"></p>
        <div><button type="button" id="renameCancel">取消</button><button class="primary" id="renameSave">保存</button></div>
      </form>
    </dialog>
    <dialog id="directory" aria-labelledby="directoryTitle">
      <div class="directory-head"><h2 id="directoryTitle">会话列表</h2><button id="dismissDirectory" class="icon" aria-label="关闭会话列表">×</button></div>
      <div class="sync-line"><p id="cloudStatus" role="status"></p><button type="button" id="refreshDirectory">刷新</button></div>
      <input id="roomSearch" type="search" placeholder="搜索会话名称" aria-label="搜索会话名称">
      <div id="rooms"></div>
      <details id="backupSettings">
        <summary>跨设备恢复</summary>
        <p id="backupHint"></p>
        <input id="recoveryInput" type="password" autocomplete="off" spellcheck="false" aria-label="恢复码" placeholder="粘贴恢复码" hidden>
        <button type="button" id="backupAction" hidden></button>
        <input id="recoveryOutput" readonly aria-label="请私下保存恢复码" hidden>
      </details>
      <details id="newRoomDetails"><summary>新建会话</summary>
      <form id="newRoomForm">
        <label for="roomType">会话类型</label>
        <select id="roomType"><option value="direct">一对一私聊</option><option value="group">群聊</option></select>
        <label id="nameLabel" for="roomName">新会话备注（仅自己可见）</label>
        <input id="roomName" maxlength="40" placeholder="例如：周末采摘">
        <button class="primary" id="newRoom">新建私聊</button>
      </form>
      </details>
      <p id="directoryStatus" role="status"></p>
    </dialog>
    <div class="thread">
      <ul id="messages" aria-label="聊天记录" aria-live="polite"></ul>
      <div class="welcome" id="welcome">
        <span class="seal" aria-hidden="true"><i></i></span>
        <p id="intro">正在打开对话…</p>
        <button class="primary" id="create" hidden>创建会话</button>
        <label id="nickField" hidden>群内昵称 <input id="nickname" maxlength="24" autocomplete="off"></label>
        <button class="primary" id="join" hidden>接受邀请</button>
      </div>
      <button id="latest" hidden>↓ 回到最新消息</button>
    </div>
    <footer>
      <div class="feedback">
        <p id="status" role="status"></p>
        <button id="invite" hidden>复制邀请链接</button>
      </div>
      <input id="copyField" aria-label="邀请链接" readonly hidden>
      <form hidden id="composer">
        <div id="queued"></div>
        <div class="compose-row">
          <input id="files" type="file" multiple hidden>
          <button type="button" class="icon" id="attach" aria-label="添加附件" title="添加附件，每个最多 16 MB"><i class="clip"></i></button>
          <textarea id="draft" rows="1" aria-label="消息" maxlength="1500" placeholder="输入消息…" title="Enter 发送，Shift + Enter 换行"></textarea>
          <button type="submit" class="icon primary" id="send" aria-label="发送" title="发送"><i class="plane"></i></button>
        </div>
      </form>
    </footer>
  </main>
  <script type="module" src="./chat.js"></script>
</body>
</html>
